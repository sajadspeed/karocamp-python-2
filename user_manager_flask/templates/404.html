<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .code {
            font-size: 120px;
            font-weight: bold;
            margin: 0;
            color: #ff5a5f;
        }

        h1 {
            margin: 10px 0;
            font-size: 32px;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;

            background: #222;
            color: white;

            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="container">
        <p class="code">404</p>

        <h1>Oops! Page not found.</h1>

        <p>
            The page you're looking for doesn't exist.
        </p>

        <a href="/">Go Home</a>
    </div>

</body>
</html>
