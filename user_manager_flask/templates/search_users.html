<h1>Search for users</h1>

<table border="1">
    <tr>
        <th>Username</th>
        <th>Name</th>
        <th>Age</th>
        <th>Is Verified</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{user["username"]}}</td>
        <td>{{user["profile"]["name"]}}</td>
        <td>{{user["profile"]["age"]}}</td>
        {% if user["is_verified"] == True %}
        <td>🍓</td>
        {% else %}
        <td>🥕</td>
        {% endif %}
    </tr>
    {% endfor %}
</table>
